<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brújula">

<title>Brújula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Letra en rem (1rem = 16 px): respeta el tamaño de letra que elige el alumno en su navegador o su móvil.
   Layout: app de una columna para el móvil (máx. 30rem), una vista cada vez y barra de 3 secciones abajo (Hoy, Temario, Exámenes). Colores y tipos del sistema de diseño Brújula. */
:root {
  --fondo: #eef1f4; --superficie: #ffffff; --hundida: #f7f9fa; --linea: #d5dce3; --linea-fuerte: #7c8996;
  --tinta: #12202e; --tinta-suave: #4a5866;
  --rumbo: #0a6b5b; --sobre-rumbo: #ffffff; --rumbo-suave: #dce9e5; --rumbo-fuerte: #064a3f;
  --aviso: #8a3b06; --aviso-fuerte: #5a2604; --aviso-suave: #fff6eb; --aviso-linea: #f2d3ae;
  --marca: #fde9b8; --marca-linea: #9a6500;
  --azul: #1d3f99; --azul-suave: #e3ecff; --violeta: #4b2a8c; --violeta-suave: #ede6fb;
  --rosa: #8a1f47; --rosa-suave: #fbe4ec; --oliva: #4f5a0e; --oliva-suave: #eef2d3;
  --pizarra: #2b3946; --pizarra-suave: #e6eaee;
  --display: "Bricolage Grotesque", Figtree, system-ui, sans-serif;
  --sans: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #11171d; --superficie: #1a222a; --hundida: #0d1217; --linea: #2e3944; --linea-fuerte: #6b7988;
    --tinta: #e8edf2; --tinta-suave: #a3b0bd;
    --rumbo: #4cc2aa; --sobre-rumbo: #0b1a17; --rumbo-suave: #12302a; --rumbo-fuerte: #8fe0cf;
    --aviso: #f0a060; --aviso-fuerte: #ffd2a8; --aviso-suave: #2b1d10; --aviso-linea: #5a3b1e;
    --marca: #4a3a10; --marca-linea: #e0b040;
    --azul: #9db8ff; --azul-suave: #1a2547; --violeta: #c4aef5; --violeta-suave: #2a1f45;
    --rosa: #f29bbb; --rosa-suave: #3d1424; --oliva: #c8d46a; --oliva-suave: #262b0a;
    --pizarra: #c3cdd6; --pizarra-suave: #26303a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #11171d; --superficie: #1a222a; --hundida: #0d1217; --linea: #2e3944; --linea-fuerte: #6b7988;
  --tinta: #e8edf2; --tinta-suave: #a3b0bd;
  --rumbo: #4cc2aa; --sobre-rumbo: #0b1a17; --rumbo-suave: #12302a; --rumbo-fuerte: #8fe0cf;
  --aviso: #f0a060; --aviso-fuerte: #ffd2a8; --aviso-suave: #2b1d10; --aviso-linea: #5a3b1e;
  --marca: #4a3a10; --marca-linea: #e0b040;
  --azul: #9db8ff; --azul-suave: #1a2547; --violeta: #c4aef5; --violeta-suave: #2a1f45;
  --rosa: #f29bbb; --rosa-suave: #3d1424; --oliva: #c8d46a; --oliva-suave: #262b0a;
  --pizarra: #c3cdd6; --pizarra-suave: #26303a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--sans); font-size: 1rem; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
::placeholder { color: var(--tinta-suave); opacity: 1; } /* el gris del navegador no llega a 4,5:1 sobre el fondo de los campos */
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rumbo); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }

.app { max-width: 30rem; margin: 0 auto; padding-inline: 16px; padding-block: 20px 104px; display: flex; flex-direction: column; gap: 16px; }
.titulo-portada { font-family: var(--display); font-size: 2.5rem; line-height: 1.05; font-weight: 700; }
.titulo { font-family: var(--display); font-size: 1.875rem; line-height: 1.1; font-weight: 700; }
/* Con la letra al 200 %, una palabra larga del título («asignaturas», «Terminado») no cabe en un móvil estrecho: se parte
   por donde haga falta en vez de empujar la página hacia los lados (con la letra normal no se parte ninguna). */
.titulo, .titulo-portada { overflow-wrap: anywhere; }
.subtitulo { font-size: 1.1875rem; line-height: 1.5rem; font-weight: 600; }
.cifra { font-family: var(--display); font-size: 1.75rem; line-height: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tarea-t { font-size: 1rem; line-height: 1.375rem; font-weight: 600; }
.detalle { font-size: 0.875rem; line-height: 1.25rem; color: var(--tinta-suave); }
.suave { color: var(--tinta-suave); }
.cab { display: flex; flex-direction: column; gap: 2px; }
.pila { display: flex; flex-direction: column; gap: 12px; }
.pila-s { display: flex; flex-direction: column; gap: 6px; }
.fila { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex-grow: 1; }

.etiqueta { display: inline-block; font-size: 0.875rem; line-height: 1.25rem; font-weight: 600; padding: 2px 8px; border-radius: var(--r-sm); }
.t-rumbo { background: var(--rumbo-suave); color: var(--rumbo-fuerte); }
.t-azul { background: var(--azul-suave); color: var(--azul); }
.t-violeta { background: var(--violeta-suave); color: var(--violeta); }
.t-rosa { background: var(--rosa-suave); color: var(--rosa); }
.t-oliva { background: var(--oliva-suave); color: var(--oliva); }
.t-pizarra { background: var(--pizarra-suave); color: var(--pizarra); }
.t-aviso { background: var(--aviso-suave); color: var(--aviso-fuerte); }

.boton { min-height: 48px; padding: 0 20px; border-radius: var(--r-md); border: 1.5px solid var(--tinta); background: var(--superficie); font-size: 1rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.boton.principal { background: var(--rumbo); border-color: var(--rumbo); color: var(--sobre-rumbo); }
.boton.grande { min-height: 52px; font-size: 1.0625rem; }
.boton.bloque { width: 100%; }
.boton:disabled { opacity: .45; cursor: not-allowed; }
.enlace { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; background: none; border: 0; padding: 0 2px; color: var(--rumbo); font-size: 0.9375rem; font-weight: 600; }
.enlace:hover { color: var(--rumbo-fuerte); }

.resumen { background: var(--rumbo); color: var(--sobre-rumbo); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
.resumen .detalle { color: var(--sobre-rumbo); font-size: 0.875rem; }
.caja { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
/* Hoja en blanco con puntos clave: los pasos mientras corre el reloj, y cada punto (más marcado cuando ya tiene respuesta) */
.pasos-hoja { margin: 0; padding: 16px 16px 16px 36px; gap: 12px; font-size: 1rem; line-height: 1.5rem; }
.pasos-hoja strong { font-weight: 600; }
.punto-clave.marcado { border-color: var(--linea-fuerte); }
/* Con la letra muy grande, las tres respuestas bajan a dos columnas o a una, y un título largo parte la palabra */
.opciones.ajusta { grid-template-columns: repeat(auto-fit, minmax(min(100%, 5rem), 1fr)); }
.largo { overflow-wrap: anywhere; }
.aviso { background: var(--aviso-suave); border: 1px solid var(--aviso-linea); border-radius: var(--r-lg); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.aviso .tarea-t { color: var(--aviso-fuerte); }
.aviso .detalle { color: var(--aviso); }

.tarea { width: 100%; text-align: left; background: var(--superficie); border: 1px solid var(--linea-fuerte); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.tarea:hover { border-color: var(--tinta-suave); }
.tarea .cabecera { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tarea .min { font-size: 0.875rem; font-weight: 600; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.hechas { display: flex; flex-direction: column; gap: 4px; }
.hecha { display: flex; gap: 8px; align-items: center; font-size: 0.875rem; color: var(--tinta-suave); }
.hecha svg { flex: none; stroke: var(--rumbo); }

.barra-sec { position: fixed; left: 0; right: 0; bottom: 0; background: var(--superficie); border-top: 1px solid var(--linea); padding: 4px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.barra-sec div { max-width: 30rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.barra-sec button { min-height: 54px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.875rem; position: relative; font-weight: 600; color: var(--tinta-suave); }
.barra-sec button[aria-current="page"] { color: var(--rumbo); font-weight: 700; }
.barra-sec button[aria-current="page"]::before { content: ""; position: absolute; top: -4px; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: currentColor; }
.barra-sec svg { stroke: currentColor; }
.barra-sec button span { overflow-wrap: anywhere; text-align: center; line-height: 1.15; } /* con letra grande, en dos líneas antes que pisarse (por el guion blando, «Te-mario», «Exá-menes») */

.progreso { display: flex; flex-direction: column; gap: 6px; }
.progreso .fila-p { display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--tinta-suave); }
.pista { height: 6px; background: var(--linea); border-radius: 999px; overflow: hidden; }
.relleno { height: 100%; background: var(--rumbo); border-radius: 999px; }
.top { display: flex; align-items: center; gap: 16px; }

/* Texto con errores */
.contexto { font-size: 0.875rem; color: var(--tinta-suave); }
.texto-ej { font-size: 1.0625rem; line-height: 2.75; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-lg); padding: 14px 16px; }
.trozo { position: relative; cursor: pointer; padding: 0.7em 1px; border-bottom: 1px dashed var(--linea-fuerte); border-radius: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.trozo input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; left: 0; top: 0; }
/* Señalado: además del fondo, la raya pasa de fina y a trazos a gruesa y continua (no solo el color; y sin mover el texto) */
.trozo:has(input:checked) { background: var(--marca); border-bottom: 3px solid var(--marca-linea); }
.trozo:has(input:focus-visible) { outline: 2px solid var(--rumbo); outline-offset: 1px; }
.cita { margin: 0; padding: 10px 12px; background: var(--hundida); border-radius: var(--r-md); font-size: 0.9375rem; line-height: 1.55; }
mark.m { background: var(--marca); color: inherit; border-radius: 3px; padding: 1px 2px; }
.mal { text-decoration: line-through; text-decoration-color: var(--aviso); color: var(--tinta-suave); }
.bien { font-weight: 600; color: var(--rumbo-fuerte); }
label.lab { font-size: 0.875rem; font-weight: 600; }
textarea { width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--linea-fuerte); background: var(--hundida); font-size: 1rem; line-height: 1.45; }
.opciones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opciones.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opciones.cuatro { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 19em) { .opciones.cuatro { grid-template-columns: repeat(2, minmax(0, 1fr)); } } /* «Regular» no cabe en un cuarto */
.opcion { position: relative; min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 8px; border-radius: var(--r-md); border: 1px solid var(--linea-fuerte); background: var(--superficie); font-size: 0.9375rem; font-weight: 600; line-height: 1.2; cursor: pointer; }
/* La casilla, invisible pero del tamaño de la opción: al explorar con el dedo, el lector de pantalla encuentra el botón de
   opción (y dice «marcado») y no solo su texto. */
.opcion input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
.opcion:has(input:checked), .opcion[aria-pressed="true"] { border: 2px solid var(--rumbo); background: var(--rumbo-suave); color: var(--rumbo-fuerte); }
.opcion:has(input:focus-visible), .opcion:focus-visible { outline: 2px solid var(--rumbo); outline-offset: 2px; }
/* Lo marcado, además del color y el borde más grueso, va subrayado (regla 5: ningún estado solo por color). Un subrayado
   no cambia el tamaño de la opción ni pisa el texto con la letra grande, y se ve también en el alto contraste. */
.opcion:has(input:checked) > span:first-of-type, .opcion[aria-pressed="true"] > span:first-of-type {
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.2em;
}
.opcion.larga { justify-content: flex-start; text-align: left; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; }
.opcion.larga .detalle { font-weight: 400; }
.puntos { width: 100%; border-collapse: collapse; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.puntos td { padding: 8px 0; border-top: 1px solid var(--linea); }
.puntos td:last-child { text-align: right; font-weight: 600; }
.lineas p { padding: 10px 0; font-size: 0.875rem; }
.lineas p + p { border-top: 1px solid var(--linea); }

/* Reloj */
.reloj { font-family: var(--display); font-size: clamp(56px, 18vw, 80px); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-align: center; }
.reloj.parado { color: var(--tinta-suave); }
.centro { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding-block: 40px; }
.dos-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* Temario */
.grupo { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-lg); padding: 4px 16px; }
.grupo summary { min-height: 56px; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; list-style: none; padding-block: 10px; }
.grupo summary::-webkit-details-marker { display: none; }
.grupo ul { list-style: none; margin: 0 0 8px; padding: 0; }
select { min-height: 48px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--linea-fuerte); background: var(--hundida); font-size: 1rem; width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nota-local { font-size: 0.875rem; color: var(--aviso); background: var(--aviso-suave); border: 1px solid var(--aviso-linea); border-radius: var(--r-md); padding: 8px 12px; }
/* 0.2: semáforo, semana, exámenes, ajustes */
.t-marca { background: var(--marca); color: var(--tinta); }
.cab-hoy { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.icono-btn { width: 44px; height: 44px; flex: none; border: 1px solid var(--linea-fuerte); border-radius: var(--r-md); background: var(--superficie); display: flex; align-items: center; justify-content: center; padding: 0; }
.icono-btn svg { stroke: var(--tinta); }
.dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dias .opcion { min-height: 48px; padding: 4px 0; font-size: 0.875rem; }
@media (max-width: 25rem) { .dias { grid-template-columns: repeat(4, minmax(0, 1fr)); } } /* 7 casillas de 44 px no caben: dos filas */
.lista { list-style: none; margin: 0; padding: 0; }
.lista > li { padding: 12px 0; border-top: 1px solid var(--linea); display: flex; flex-direction: column; gap: 4px; }
.lista > li:first-child { border-top: 0; }
.dia-sem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.dia-sem .min { font-size: 0.875rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.chk { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; min-height: 44px; padding: 11px 0; border-top: 1px solid var(--linea); cursor: pointer; font-size: 0.9375rem; line-height: 1.25rem; }
.chk:first-child { border-top: 0; }
.chk input { width: 20px; height: 20px; margin: 0; accent-color: var(--rumbo); }
.asig-fila { width: 100%; text-align: left; background: var(--superficie); border: 1px solid var(--linea-fuerte); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.asig-fila:hover { border-color: var(--tinta-suave); }
details.grupo { border-color: var(--linea-fuerte); } /* se despliega al tocarlo */
.cuenta { display: flex; flex-wrap: wrap; gap: 6px; }
.examen { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; }
.fecha-caja { border: 1px solid var(--linea-fuerte); border-radius: var(--r-md); text-align: center; padding: 6px 0; font-variant-numeric: tabular-nums; }
.fecha-caja .d { display: block; font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.375rem; }
.fecha-caja .m { display: block; font-size: 0.875rem; color: var(--tinta-suave); }
.fecha-caja.cerca { border-color: var(--aviso); background: var(--aviso-suave); }
input[type="date"], input[type="text"] { min-height: 48px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--linea-fuerte); background: var(--hundida); font-size: 1rem; width: 100%; }
.libre { background: var(--rumbo-suave); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.libre .tarea-t { color: var(--rumbo-fuerte); }
/* Mapa por bloques (pantalla 17 del canvas): una tarjeta desplegable por bloque, con su barra de colores y sus temas */
.etiqueta.grande { font-size: 0.875rem; line-height: 1.25rem; padding: 2px 8px; align-self: flex-start; }
.intro { font-size: 0.9375rem; line-height: 1.375rem; color: var(--tinta-suave); }
.aviso .aviso-detalle { font-size: 0.875rem; line-height: 1.25rem; color: var(--aviso); }
.mapa { display: flex; flex-direction: column; gap: 14px; }
.mapa-asig > summary { min-height: 52px; display: flex; align-items: center; gap: 12px; cursor: pointer; list-style: none; }
.mapa-bloque { background: var(--superficie); border: 1px solid var(--linea-fuerte); border-radius: var(--r-lg); padding: 0 16px; }
.mapa-bloque > summary { display: flex; align-items: flex-start; gap: 12px; min-height: 64px; padding: 14px 0; cursor: pointer; list-style: none; }
.mapa-bloque > summary::-webkit-details-marker, .mapa-asig > summary::-webkit-details-marker { display: none; }
.mapa-cab { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-width: 0; }
.mapa-titulo { font-size: 1rem; line-height: 1.375rem; font-weight: 600; }
.mapa-detalle { font-size: 0.9375rem; line-height: 1.3125rem; color: var(--tinta-suave); }
.galon { flex: none; stroke: var(--tinta-suave); margin-top: 1px; }
details[open] > summary .galon { transform: rotate(180deg); }
.barra-temas { display: flex; gap: 4px; }
.barra-temas > span { flex: 1 1 0; height: 12px; box-sizing: border-box; border-radius: 4px; border-width: 1.5px; border-style: solid; }
.barra-temas > span:not([class]) { background: var(--linea); border-color: var(--linea); } /* aún no dado */
.mapa-lista { list-style: none; margin: 0; padding: 0 0 4px; }
.mapa-lista > li { border-top: 1px solid var(--linea); }
.fila-tema { width: 100%; min-height: 56px; padding: 8px 0; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left; color: var(--tinta); }
.fila-tema .izq { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex-grow: 1; min-width: 0; }
.fila-tema .nom { font-size: 0.9375rem; line-height: 1.25rem; overflow-wrap: break-word; max-width: 100%; }
.fila-tema { flex-wrap: wrap; } .fila-tema .izq { flex-basis: 8rem; } /* 8rem: cabe «hispanoamericana:», la palabra más larga */
.fila-tema .dcha { flex: none; display: flex; align-items: center; gap: 10px; } /* la etiqueta y la flecha, siempre juntas */ /* si no caben, la etiqueta baja a su propia línea: el nombre no se tapa ni se parte en trozos */
.fila-tema.nodado .nom { color: var(--tinta-suave); }
.fila-tema svg { flex: none; stroke: var(--tinta-suave); }

da el enunciado"}, "p2": {"nombre": "Pregunta práctica dos bloques 3 ou 4 (1)", "practica": "Comentario de una pirámide, un plano urbano o una imagen de paisaje agrario/industrial/turístico: identificar el documento y explicar"}, "p3": {"nombre": "Pregunta práctica dos bloques 3 ou 4 (2)", "practica": "Comentario de un documento de población, ciudad o economía"}, "p4": {"nombre": "Vocabulario xeográfico específico", "practica": "Tarjetas de Anki de los 70 términos: definición breve + ejemplo español"}}, "temas": [{"id": "x01", "nombre": "Litología y modelado del relieve", "texto": "Mapa da diversidade litolóxica. Debuxos e gráficos sobre o modelado: granítico, cárstico, arxiloso e volcánico.", "vital": false, "ej": ["p1"], "proc": false}, {"id": "x02", "nombre": "Paisajes naturales", "texto": "Comentario de imaxes de paisaxes naturais: atlántica, mediterránea, de montaña e das Canarias. Cliseries de Teide e Pireneos.", "vital": false, "ej": ["p1"], "proc": false}, {"id": "x03", "nombre": "El mapa del tiempo", "texto": "Interpretación do mapa do tempo, en especial se fai referencia a DANAs, advección do oeste e suroeste e anticiclón de verán. Novas de fenómenos meteorolóxicos adversos.", "vital": false, "ej": ["p1"], "proc": false}, {"id": "x04", "nombre": "Climogramas y climas de España", "texto": "Análise de climogramas que resalten contrastes en relación con mapas e gráficos de distribución de climas, temperaturas e precipitacións.", "vital": false, "ej": ["p1"], "proc": false}, {"id": "x05", "nombre": "Imágenes de satélite: inversión térmica, tormentas y sequías", "texto": "Fotografías de satélite para identificar situacións de inversión térmica ou convección treboenta. Comparativas de ortofotos de Copernicus sobre impactos das secas na paisaxe.", "vital": false, "ej": ["p1"], "proc": false}, {"id": "x06", "nombre": "El agua en España", "texto": "Mapas e gráficos sobre recursos e problemática hídrica en España.", "vital": false, "ej": ["p1"], "proc": false}, {"id": "x07", "nombre": "Población: envejecimiento, densidad y crecimiento natural", "texto": "Uso de mapas, gráficos e textos sobre o avellentamento, densidade de poboación, saldo vexetativo e movemento natural da poboación.", "vital": false, "ej": ["p2", "p3"], "proc": false}, {"id": "x08", "nombre": "Migraciones y la España vaciada", "texto": "Problemáticas migratoria e da España baleirada.", "vital": false, "ej": ["p2", "p3"], "proc": false}, {"id": "x09", "nombre": "Planos y paisajes urbanos", "texto": "Planos urbanos e/ou fotografías e fotografías aéreas coa intención de identificar cascos históricos e ensanches. Análise de paisaxes urbanas.", "vital": false, "ej": ["p2", "p3"], "proc": false}, {"id": "x10", "nombre": "El sistema urbano español", "texto": "Mapas do sistema urbano español.", "vital": false, "ej": ["p2", "p3"], "proc": false}, {"id": "x11", "nombre": "La PAC y la agricultura sostenible", "texto": "A repercusión da PAC. Novas sobre prácticas sostibles e insostibles na agricultura. Mapas/ortofotos sobre incremento de regadío en España.", "vital": false, "ej": ["p2", "p3"], "proc": false}, {"id": "x12", "nombre": "Paisajes agrarios", "texto": "Mapas e imaxes sobre paisaxes agrarias predominantes en España: oceánica, mediterránea, de montaña e cultivo baixo plástico.", "vital": false, "ej": ["p2", "p3"], "proc": false}, {"id": "x13", "nombre": "Paisajes industriales y energía", "texto": "Análise e comentario de paisaxes industriais e/ou mapas e gráficos de infraestruturas enerxéticas. Comparativa de imaxes parque tecnolóxico/polígono industrial tradicional.", "vital": false, "ej": ["p2", "p3"], "proc": false}, {"id": "x14", "nombre": "Turismo y turismofobia", "texto": "Análise e comentarios de mapas e paisaxes turísticas e novas sobre turismofobia.", "vital": true, "ej": ["p2", "p3"], "proc": false}, {"id": "v01", "nombre": "Vocabulario geográfico (70 términos)", "texto": "Vocabulario: 70 termos dos bloques 1, 2, 3 e 4", "vital": true, "ej": ["p4"], "proc": false}], "bloques": [{"id": "b2", "nombre": "Bloque 2 · La sustentabilidad del medio físico de España", "ejercicio": "Ejercicio 1", "destreza": false, "origen": "fuente", "temas": ["x01", "x02", "x03", "x04", "x05", "x06"], "vais_por": false}, {"id": "b3", "nombre": "Bloque 3 · La ordenación del territorio: enfoque ecosocial", "ejercicio": "Ejercicios 2 y 3", "destreza": false, "origen": "fuente", "temas": ["x07", "x08", "x09", "x10"], "vais_por": false}, {"id": "b4", "nombre": "Bloque 4 · La ordenación del territorio: enfoque económico", "ejercicio": "Ejercicios 2 y 3", "destreza": false, "origen": "fuente", "temas": ["x11", "x12", "x13", "x14"], "vais_por": false}, {"id": "voc", "nombre": "Vocabulario", "ejercicio": "Ejercicio 4", "destreza": false, "origen": "fuente", "temas": ["v01"], "vais_por": false}]}], "fuenteCatalogo": "Catálogo CiUG de la Brújula (Clase/_brujula/ciug), espejo del 2026-10-02", "textos": [{"id": "h1-c01-a", "p": 1, "contexto": "Trabajas en un archivo municipal y te piden revisar este texto, escrito con ayuda de una IA, para un panel informativo.", "trozos": [{"t": "El matrimonio de Isabel de Castilla y Fernando de Aragón en 1469 dio origen, ", "e": 0}, {"t": "cuando ambos accedieron a sus tronos, ", "e": 0}, {"t": "a la llamada Monarquía Hispánica, ", "e": 0}, {"t": "que unió las economías de las dos coronas en un mercado común. ", "e": 1}, {"t": "Se trataba de una unión dinástica: ", "e": 0}, {"t": "cada reino conservó sus propias leyes, ", "e": 0}, {"t": "Cortes e instituciones. ", "e": 0}, {"t": "Por eso los monarcas no utilizaron el título de reyes de España, ", "e": 0}, {"t": "sino el de sus respectivas coronas. ", "e": 0}, {"t": "Organizaron también un sistema de consejos, ", "e": 0}, {"t": "como el Consejo Real de Castilla, ", "e": 0}, {"t": "que tomaba las decisiones de gobierno en lugar de los monarcas. ", "e": 2}, {"t": "En los municipios castellanos, el corregidor, ", "e": 0}, {"t": "nombrado por el rey, ", "e": 0}, {"t": "frenaba el poder de las oligarquías locales.", "e": 0}], "errores": [{"erroneo": "que unió las economías de las dos coronas en un mercado común", "correcto": "que no supuso una unidad económica entre las dos coronas", "explicacion": "La unión de los Reyes Católicos fue dinástica o personal, no institucional: los reinos solo tenían en común a los monarcas. Las leyes, el idioma, las costumbres, las instituciones y las Cortes de cada reino siguieron siendo distintas, y tampoco hubo una unidad económica.", "fuente": "Apuntes, pregunta 1 (unión dinástica), p. 18.", "frase": "El matrimonio de Isabel de Castilla y Fernando de Aragón en 1469 dio origen, cuando ambos accedieron a sus tronos, a la llamada Monarquía Hispánica, que unió las economías de las dos coronas en un mercado común.", "fraseBien": "El matrimonio de Isabel de Castilla y Fernando de Aragón en 1469 dio origen, cuando ambos accedieron a sus tronos, a la llamada Monarquía Hispánica, que no supuso una unidad económica entre las dos coronas."}, {"erroneo": "que tomaba las decisiones de gobierno en lugar de los monarcas", "correcto": "órgano consultivo que apoyaba el gobierno de la Corona", "explicacion": "El Consejo Real de Castilla era un órgano consultivo: apoyaba el gobierno de la Corona, pero no decidía en lugar de los reyes. Las reformas buscaban justo lo contrario: que el rey concentrase todo el poder y surgiese un Estado fuerte.", "fuente": "Apuntes, pregunta 1 (reorganización político-administrativa), p. 18.", "frase": "Organizaron también un sistema de consejos, como el Consejo Real de Castilla, que tomaba las decisiones de gobierno en lugar de los monarcas.", "fraseBien": "Organizaron también un sistema de consejos, como el Consejo Real de Castilla, órgano consultivo que apoyaba el gobierno de la Corona."}], "revisado": true}, {"id": "h1-c01-b", "p": 1, "contexto": "Una revista de divulgación histórica te pide revisar este texto antes de publicarlo. Lo ha redactado una IA.", "trozos": [{"t": "Las reformas de los Reyes Católicos buscaron reforzar el poder real y centralizar el gobierno. ", "e": 0}, {"t": "La nobleza y el clero perdieron poder político y, a cambio, empezaron a pagar impuestos a la Corona. ", "e": 1}, {"t": "En los municipios se impuso el corregidor, nombrado por el rey, que frenaba el poder de las oligarquías locales. ", "e": 0}, {"t": "En el mundo rural, el orden quedó en manos de la Santa Hermandad, un cuerpo policial. ", "e": 0}, {"t": "Por último, la Inquisición solo actuó en la Corona de Castilla, por lo que cada reino mantuvo su propio tribunal religioso.", "e": 2}], "errores": [{"erroneo": " y, a cambio, empezaron a pagar impuestos a la Corona", "correcto": ", aunque conservaron su poder económico y siguieron sin pagar impuestos", "explicacion": "Las reformas apartaron a la nobleza y al clero del gobierno (por ejemplo, la Hacienda pasó a manos de secretarios y letrados), pero conservaron sus tierras y sus rentas y siguieron sin pagar impuestos: nobleza e Iglesia no estaban obligadas a pagar los gastos de la Hacienda. Por eso a la Corona le faltaban recursos.", "fuente": "Apuntes, pregunta 1 (reorganización político-administrativa), pp. 18-19.", "frase": "La nobleza y el clero perdieron poder político y, a cambio, empezaron a pagar impuestos a la Corona.", "fraseBien": "La nobleza y el clero perdieron poder político, aunque conservaron su poder económico y siguieron sin pagar impuestos."}, {"erroneo": "solo actuó en la Corona de Castilla, por lo que cada reino mantuvo su propio tribunal religioso", "correcto": "fue la única institución común a todos sus reinos, encargada de mantener la ortodoxia católica", "explicacion": "El Tribunal de la Inquisición actuaba en todos los reinos de los Reyes Católicos: era la única institución común. Se usó con fines religiosos y también políticos, para reforzar el poder del rey.", "fuente": "Apuntes, pregunta 1 (política religiosa), p. 19.", "frase": "Por último, la Inquisición solo actuó en la Corona de Castilla, por lo que cada reino mantuvo su propio tribunal religioso.", "fraseBien": "Por último, la Inquisición fue la única institución común a todos sus reinos, encargada de mantener la ortodoxia católica."}], "revisado": true}, {"id": "h1-c02-a", "p": 2, "contexto": "Tu instituto prepara un pódcast sobre Felipe II y te pide revisar el guion, escrito con ayuda de una IA.", "trozos": [{"t": "En 1556 Carlos I abdicó en su hijo Felipe II, ", "e": 0}, {"t": "que heredó la Corona y todos sus territorios salvo el archiducado de Austria y el título de emperador, que quedaron ", "e": 0}, {"t": "para el hermano de Carlos, Fernando. ", "e": 0}, {"t": "Felipe II estableció la capital permanente en Madrid. ", "e": 0}, {"t": "En 1580, tras la muerte sin descendencia del rey portugués Henrique I, incorporó Portugal ", "e": 0}, {"t": "gracias a su matrimonio con Isabel de Portugal, ", "e": 1}, {"t": "y prometió respetar sus leyes e instituciones. ", "e": 0}, {"t": "El mayor problema del reinado fue la guerra de Flandes, ", "e": 0}, {"t": "provocada por los fuertes impuestos, ", "e": 0}, {"t": "el sentimiento nacionalista y la expansión del protestantismo. ", "e": 0}, {"t": "Felipe II envió al duque de Alba, ", "e": 0}, {"t": "que con una política de conciliación intentó atraerse a los habitantes de Flandes. ", "e": 2}, {"t": "Tras una larga guerra, ", "e": 0}, {"t": "el sur aceptó la obediencia a Felipe II y el catolicismo, ", "e": 0}, {"t": "mientras que el norte calvinista luchó por su independencia.", "e": 0}], "errores": [{"erroneo": "gracias a su matrimonio con Isabel de Portugal", "correcto": "haciendo valer sus derechos como hijo de Isabel de Portugal", "explicacion": "Isabel de Portugal no era la esposa de Felipe II, sino su madre (la esposa de Carlos I). Felipe II llegó al trono portugués por herencia: como hijo suyo, reclamó la corona al morir sin hijos Henrique I. Para ser reconocido prometió respetar las leyes e instituciones portuguesas, así que fue una unión en la persona del monarca (la Unión Ibérica) y Portugal conservó gran independencia.", "fuente": "Apuntes, pregunta 2 (incorporación de Portugal), p. 20.", "frase": "En 1580, tras la muerte sin descendencia del rey portugués Henrique I, incorporó Portugal gracias a su matrimonio con Isabel de Portugal, y prometió respetar sus leyes e instituciones.", "fraseBien": "En 1580, tras la muerte sin descendencia del rey portugués Henrique I, incorporó Portugal haciendo valer sus derechos como hijo de Isabel de Portugal, y prometió respetar sus leyes e instituciones."}, {"erroneo": "que con una política de conciliación intentó atraerse a los habitantes de Flandes", "correcto": "pero la dura represión que ejerció provocó la rebelión", "explicacion": "El duque de Alba fue enviado para controlar Flandes, pero la represión que ejerció hizo estallar la rebelión. En la guerra que siguió, los rebeldes recibieron el apoyo de Inglaterra y Francia, y solo el sur de los Países Bajos volvió a la obediencia de Felipe II.", "fuente": "Apuntes, pregunta 2 (guerra de los Países Bajos), p. 21.", "frase": "Felipe II envió al duque de Alba, que con una política de conciliación intentó atraerse a los habitantes de Flandes.", "fraseBien": "Felipe II envió al duque de Alba, pero la dura represión que ejerció provocó la rebelión."}], "revisado": true}, {"id": "h1-c02-b", "p": 2, "contexto": "Un museo prepara una sala sobre la política exterior de Felipe II y te pide revisar el texto de un panel, generado con IA.", "trozos": [{"t": "Felipe II quiso mantener la hegemonía de su dinastía en Europa ", "e": 0}, {"t": "y en ultramar, ", "e": 0}, {"t": "lo que le obligó a un importante esfuerzo militar. ", "e": 0}, {"t": "Frente a Francia obtuvo la victoria de San Quintín (1557) y, ", "e": 0}, {"t": "en las guerras de religión francesas, ", "e": 0}, {"t": "apoyó a los hugonotes. ", "e": 1}, {"t": "En el Mediterráneo, ", "e": 0}, {"t": "una flota mandada por don Juan de Austria derrotó a los turcos en Lepanto (1571). ", "e": 0}, {"t": "Con Inglaterra, las relaciones se rompieron ", "e": 0}, {"t": "tras la coronación de Isabel I, ", "e": 0}, {"t": "que impuso el anglicanismo, ", "e": 0}, {"t": "aunque se mantuvo neutral en la guerra de Flandes. ", "e": 2}, {"t": "Por ello, Felipe II preparó la Empresa de Inglaterra, ", "e": 0}, {"t": "que terminó con el desastre de la Gran Armada.", "e": 0}], "errores": [{"erroneo": "apoyó a los hugonotes", "correcto": "apoyó a los católicos frente a los hugonotes", "explicacion": "Felipe II se veía como defensor del catolicismo, así que en las guerras de religión de Francia apoyó a los católicos frente a los hugonotes, que eran protestantes calvinistas.", "fuente": "Apuntes, pregunta 2 (conflictos con Francia), p. 20.", "frase": "Frente a Francia obtuvo la victoria de San Quintín (1557) y, en las guerras de religión francesas, apoyó a los hugonotes.", "fraseBien": "Frente a Francia obtuvo la victoria de San Quintín (1557) y, en las guerras de religión francesas, apoyó a los católicos frente a los hugonotes."}, {"erroneo": ", aunque se mantuvo neutral en la guerra de Flandes", "correcto": " y apoyó a los protestantes de Flandes", "explicacion": "Isabel I no se mantuvo al margen: además de imponer el anglicanismo, apoyó a los protestantes de Flandes que se habían rebelado contra Felipe II. Ese apoyo fue lo que le llevó a preparar la Empresa de Inglaterra, que acabó con el desastre de la Gran Armada.", "fuente": "Apuntes, pregunta 2 (Inglaterra), p. 20.", "frase": "Con Inglaterra, las relaciones se rompieron tras la coronación de Isabel I, que impuso el anglicanismo, aunque se mantuvo neutral en la guerra de Flandes.", "fraseBien": "Con Inglaterra, las relaciones se rompieron tras la coronación de Isabel I, que impuso el anglicanismo y apoyó a los protestantes de Flandes."}], "revisado": true}, {"id": "h1-c03-a", "p": 3, "contexto": "Una editorial te pide revisar el resumen de un libro de texto que ha redactado una IA.", "trozos": [{"t": "En 1621 subió al trono Felipe IV, ", "e": 0}, {"t": "que dejó el gobierno en manos de su valido, ", "e": 0}, {"t": "el conde-duque de Olivares. ", "e": 0}, {"t": "Su objetivo era convertir la monarquía, ", "e": 0}, {"t": "formada por reinos independientes con un rey común, ", "e": 0}, {"t": "en un solo Estado con las mismas leyes e instituciones, ", "e": 0}, {"t": "que habían de ser las aragonesas. ", "e": 1}, {"t": "Para ello saneó la administración y creó juntas ", "e": 0}, {"t": "para resolver los males de Castilla. ", "e": 0}, {"t": "Su proyecto principal fue la Unión de Armas, ", "e": 0}, {"t": "un ejército permanente pagado y con hombres de todos los reinos, ", "e": 0}, {"t": "según su población y su riqueza, ", "e": 0}, {"t": "que logró integrar los territorios y acabar con sus fueros.", "e": 2}], "errores": [{"erroneo": "que habían de ser las aragonesas", "correcto": "que habían de ser las castellanas", "explicacion": "Olivares quería integrar todos los reinos en un Estado común con las leyes e instituciones de Castilla, eliminando los privilegios forales de los demás reinos.", "fuente": "Apuntes, pregunta 3 (crisis política), p. 22.", "frase": "Su objetivo era convertir la monarquía, formada por reinos independientes con un rey común, en un solo Estado con las mismas leyes e instituciones, que habían de ser las aragonesas.", "fraseBien": "Su objetivo era convertir la monarquía, formada por reinos independientes con un rey común, en un solo Estado con las mismas leyes e instituciones, que habían de ser las castellanas."}, {"erroneo": "que logró integrar los territorios y acabar con sus fueros", "correcto": "aunque su aplicación fue imposible", "explicacion": "La Unión de Armas buscaba integrar todos los territorios, eliminar los privilegios forales y reforzar el poder del monarca, pero su aplicación fue imposible: los reinos periféricos se opusieron y en la década de 1640 estallaron las revueltas de Cataluña y Portugal.", "fuente": "Apuntes, pregunta 3 (Unión de /* ---------- catálogo (temario oficial de la CiUG) ---------- */
const ASIG = D.asignaturas;
const AS = {}; for (const a of ASIG) AS[a.id] = a;
const TEMA = {}; for (const a of ASIG) for (const t of a.temas) TEMA[a.id + ":" + t.id] = Object.assign({ asig: a.id, key: a.id + ":" + t.id }, t);
const TEXTO = {}; for (const t of D.textos) TEXTO[t.id] = t;
/* Puntos clave de la hoja en blanco (banco/historia/puntos.yaml): solo llegan los revisados por Luis.
   Ejemplo: PUNTOS["historia:c12"].puntos[0].titulo -> "El contexto". */
const PUNTOS = {}; for (const p of D.puntos || []) PUNTOS[p.key] = p;
function z2(n) { return String(n).padStart(2, "0"); }
const idHist = (n) => "c" + z2(n);
const nHist = (id) => Number(String(id).slice(1));

/* Semáforo de la Brújula: sube con una sesión que sale bien, baja con una mala; el alumno puede cambiarlo cuando quiera. */
const ESTADOS = { rojo: "Sin estudiar", amarillo: "Estudiado una vez", verde: "Repasado", estrella: "Lo sé sin apuntes" };
const ORDEN_E = ["rojo", "amarillo", "verde", "estrella"];
const TONO_E = { rojo: "aviso", amarillo: "marca", verde: "rumbo", estrella: "azul" };
const FLOJO = { rojo: 3, amarillo: 2, verde: 1, estrella: 0 };
const COMO_VA = { bien: "verde", regular: "amarillo", mal: "rojo" };
const COMO_VA_TXT = { bien: "Bien", regular: "Regular", mal: "Mal", nada: "Aún nada" };

/* Bloques del temario (app/bloques.yaml, comprobados por app/build.py). Desde el 25/10/2026 (decidido por Luis: cada
   profesor va en su orden) ningún bloque lleva «vais por»: lo dado en clase se marca tema a tema. Un tema está dado si
   el alumno lo ha marcado (dadoEnClase) o es de destreza; puede tener color sin estar dado, si entró en un examen o lo
   estudió con «Estudiar otra cosa». Lo que quede de «vais por» en datos de antes se pasa a
   colores una vez (pasarVaisPorATemas) y se guarda aparte en prog.vaisPorAntes, sin usar.
   Hasta entonces, prog.vaisPor[asignatura][bloque] era el id del tema que estabais dando (lo de antes contaba como
   dado), FIN = terminado y null = sin empezar. */
const FIN = "fin";
const BLOQUE_DE = {}; // clave de tema («empresa:e05») -> { b: su bloque, pos: su sitio en el bloque (0 = el primero) }
for (const a of ASIG) for (const b of a.bloques) { b.asig = a.id; b.temas.forEach((id, pos) => { BLOQUE_DE[a.id + ":" + id] = { b, pos }; }); }
/* Los bloques de una asignatura, en el orden de bloques.yaml. Ejemplo: bloquesDe("historia")[1].id -> "b2". */
function bloquesDe(asig) { return AS[asig].bloques; }
/* Un bloque por su id, o null si no existe. Ejemplo: bloqueDeId("lengua", "b3").vais_por -> false. */
function bloqueDeId(asig, id) { return AS[asig].bloques.find((b) => b.id === id) || null; }
/* «Bloque 1 · La empresa y su entorno» -> «Bloque 1»; un nombre sin «·» se queda entero. */
function nombreCortoBloque(b) { return b.nombre.split(" · ")[0]; }
/* «Bloque 1 · De los Reyes Católicos…» -> «de los Reyes Católicos…» (lo que va tras el «·»; vacío si no hay). */
function descripcionBloque(b) { const r = b.nombre.split(" · ").slice(1).join(" · "); return r ? r.charAt(0).toLowerCase() + r.slice(1) : ""; }
/* En Historia, qué preguntas tiene un bloque. Ejemplo: rangoHist(bloqueDeId("historia", "b1")) -> «preguntas 1 a 10». */
function rangoHist(b) { const n = b.temas.map(nHist); return "preguntas " + Math.min(...n) + " a " + Math.max(...n); } // aunque se cambie el orden de clase

/* Sistema ligero (la Brújula de Luis, 00_REGLAS, 10/10/2026): estudiar un poco cada día sin que el estudio ocupe la mayor parte
   del tiempo. Cuánto se estudia lo decide la cuota del día; qué se estudia, la prioridad. La prioridad nunca sube la cuota. */

/* ---------- utilidades ---------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function fechaISO(d) { return d.getFullYear() + "-" + z2(d.getMonth() + 1) + "-" + z2(d.getDate()); }
function hoyISO() { return fechaISO(new Date()); }
function aFecha(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function sumarDias(iso, n) { const f = aFecha(iso); return fechaISO(new Date(f.getFullYear(), f.getMonth(), f.getDate() + n)); }
function diasEntre(a, b) { return Math.round((aFecha(b) - aFecha(a)) / 86400000); }
function diaSemana(iso) { return (aFecha(iso).getDay() + 6) % 7; } // 0 = lunes
function lunesDe(iso) { return sumarDias(iso, -diaSemana(iso)); }

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function fechaLarga(iso) { return cap(fmt({ weekday: "long", day: "numeric", month: "long" }).format(aFecha(iso || hoyISO()))); }
function fechaDia(iso) { return fmt({ weekday: "long", day: "numeric" }).format(aFecha(iso)); }
function fechaCorta(iso) { return fmt({ day: "numeric", month: "long" }).format(aFecha(iso)); }

/* Un bloque en «¿Qué habéis dado?»: su nombre, cuántos hay marcados, «Todo» y una casilla por tema (como en «Nuevo

/* Marca o desmarca un tema como dado en el borrador del alta. Si ya estaba guardado al entrar, vuelve a como estaba

/* El alias del piloto: nunca el nombre real. Opcional: sin alias, la app funciona igual y no se apunta nada. */

/* El alias, sin lo que no sean letras, números, espacios, puntos, guiones o guiones bajos (así no puede ser una

function resultado() {
  const s = S.ses, t = TEXTO[s.texto];
  const encontrado = {}, sobran = [];
  for (const i of [...s.marcados].sort((a, b) => a - b)) {
    const e = t.trozos[i].e;
    if (e && encontrado[e] === undefined) encontrado[e] = i; else sobran.push(i);
  }
  let s11 = 0, s12 = 0, s13 = 0, completo = true;
  for (const n of [1, 2]) {
    if (encontrado[n] === undefined) continue;
    s11 += 0.25;
    const ex = s.auto["ex" + n], co = s.auto["co" + n];
    if (!ex || !co) completo = false;
    s12 += ex === "si" ? 0.75 : ex === "parte" ? 0.5 : 0;
    s13 += co === "si" ? 0.25 : 0;
  }
  return { encontrado, sobran, s11, s12, s13, total: s11 + s12 + s13, completo };
}
function marcarHecha(tareaId) {
  const t = (prog.hoy.plan || []).find((x) => x.id === tareaId);

  if (t.fuente === "fondo") prog.fondo[t.asig] = hoyISO();
  return t;
}

  S.fin = { tipo: "ej1", texto: t.id, p: t.p, key, min, res, cambio };

/* Cuenta lo marcado en los puntos de una pregunta y da el resultado para el semáforo.

/* Al cerrar la hoja o el aviso, el foco vuelve al tema que se tocó. */

  const n = key && document.getElementById(idFila(key));

/* Los próximos días de clase (de lunes a viernes), desde mañana: los que se pueden tocar (6, y luego «Otro día» y

function diasDeClase() {

function cuandoExamenTexto(fecha) {

  if (!fecha) return { titulo: S.ex.otro ? "Otro día." : "Elige el día.", texto: S.ex.otro ? "Escribe la fecha del examen." : "Con la fecha, «Qué toca hoy» lo tiene en cuenta." };

const VISTAS = { inicio: vInicio, hoy: vHoy, semana: vSemana, ajustar: vAjustar, sesion: vSesion, terminado: vTerminado, reloj: vReloj, fin: vFin,

function sinCifra(html) { return html.replace(/(id="cifra-reloj"[^>]*>)[^<]*/, "$1").replace(/(<details\b[^>]*?) open>/g, "$1>"); }
/* Pinta la vista actual. Con enfocar, sube arriba y lleva el foco al título (al cambiar de pantalla). Con siCambia, no
   rehace la pantalla si saldría igual: así, al volver a la app o al llegar un cambio de otro dispositivo, el lector de
   pantalla no pierde por dónde iba. Devuelve false si no ha pintado. */
function pintar(enfocar, siCambia) {
  const app = document.getElementById("app");
  if (S.vista === "cargando") return false;
  const html = VISTAS[S.vista]();
  if (siCambia && sinCifra(html) === sinCifra(ultimoHTML)) return false;
  app.innerHTML = html; ultimoHTML = html;
  if (A.sinAlmacen && !app.querySelector("#sin-almacen")) app.insertAdjacentHTML("afterbegin", notaSinAlmacen());
  document.body.classList.toggle("con-hoja", !!S.hoja);
  // Con la hoja abierta, lo de detrás queda inerte: aria-modal no basta para VoiceOver, que al deslizar el dedo se sale
  // de la hoja y llega a la lista de detrás y a la barra de abajo
  // (todo lo que no es la hoja ni la contiene, subiendo desde ella hasta #app)
  const velo = S.hoja ? app.querySelector(".velo") : null;
  document.getElementById("barra").inert = !!velo;
  for (let e = velo; e && e !== app; e = e.parentElement) for (const h of e.parentElement.children) if (h !== e) h.inert = true;
  document.body.classList.toggle("con-aviso", !!S.mapa.aviso);
  // «Todo» de un bloque que entra solo en parte: la casilla enseña la raya de «en parte» (el lector dice «parcialmente marcada»)

}
/* Lo fijo de abajo (la barra de secciones, el aviso de lo guardado o el pie de «Nuevo examen») crece con la letra: el aviso
   se pone justo encima de la barra, la página deja hueco para que no tape lo último, y lo que recibe el foco con Tab
   tampoco queda debajo (el navegador deja ese hueco al hacer scroll). Se repite al cambiar el tamaño (girar el móvil). */
function ajustarHuecos() {
  const app = document.getElementById("app"), sec = SECCION[S.vista], barra = document.getElementById("barra");
  const pie = app.querySelector(".pie-ex"), aviso = app.querySelector(".aviso-guardado");
  if (aviso) aviso.style.bottom = sec ? barra.offsetHeight + "px" : "0px";
  app.style.paddingBottom = aviso ? Math.ceil(window.innerHeight - aviso.getBoundingClientRect().top) + 16 + "px" : "";
  // Si el pie de «Nuevo examen» ocupa más de un tercio de la pantalla (letra grande, móvil en horizontal), deja de ir pegado
  // abajo y se queda al final de la página, en su sitio: pegado taparía casi todo lo demás
  if (pie) pie.classList.toggle("suelto", pie.offsetHeight > window.innerHeight / 3);
  const pegado = pie && !pie.classList.contains("suelto");
  const tapa = pegado ? pie.offsetHeight : aviso ? window.innerHeight - aviso.getBoundingClientRect().top : sec ? barra.offsetHeight : 0;

window.addEventListener("resize", ajustarHuecos);
function ir(vista) { S.vista = vista; S.vistaDesde = Date.now(); A.error = ""; S.hoja = null; S.mapa.aviso = null; pintar(true); }
/* Repinta sin perder el sitio ni el foco (para los controles que cambian la vista al momento), tampoco dentro de la hoja.

function repintar(el, siCambia) {

  const y = window.scrollY, id = el && el.id, hoja = document.getElementById("hoja"), yHoja = hoja ? hoja.scrollTop : 0;

  if (!pintar(false, siCambia)) return;

document.addEventListener("change", (ev) => {

  if (acc === "ini-asig") { S.ini.asignaturas[el.checked ? "add" : "delete"](el.value); return repintar(el); }

    tocarExamen(); return repintar(el);
  }
  if (acc === "ex-como") { S.ex.como = el.value; tocarExamen(); return repintar(el); }
});
/* Los bloques del mapa se despliegan a mano: se recuerda cuáles, para que no se cierren al repintar. */
document.addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (d.dataset && d.dataset.bloque) S.mapa.abiertos[d.dataset.bloque] = d.open;
  if (d.dataset && d.dataset.exBloque && S.ex) S.ex.abiertos[d.dataset.exBloque] = d.open;
  if (d.dataset && d.dataset.dadoBloque && S.ini) S.ini.abiertos[d.dataset.dadoBloque] = d.open;
}, true);
/* Con la hoja abierta: Escape es «Cancelar», y Tab no se sale de la hoja. */
document.addEventListener("keydown", (ev) => {
  const hoja = S.hoja && document.getElementById("hoja");
  if (!hoja) return;
  if (ev.key === "Escape") { ev.preventDefault(); return cerrarHoja(); }
  if (ev.key !== "Tab") return;
  const focos = [...hoja.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex]:not([tabindex="-1"])')];
  if (!focos.length) return;
  const activo = document.activeElement, primero = focos[0], ultimo = focos[focos.length - 1];
  if (ev.shiftKey && (activo === primero || activo === hoja || !hoja.contains(activo))) { ev.preventDefault(); ultimo.focus(); }
  else if (!ev.shiftKey && (activo === ultimo || !hoja.contains(activo))) { ev.preventDefault(); primero.focus(); }
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.campo && S.ses) { const i = el.dataset.i; S.ses.resp[i] = S.ses.resp[i] || {}; S.ses.resp[i][el.dataset.campo] = el.value; }
  if (el.dataset && el.dataset.accion === "ini-alias" && S.ini) {
    // Sin repintar (no se pierde el foco): solo el aviso de debajo y si se puede seguir
    S.ini.alias = el.value;
    const aviso = avisoAlias(el.value), n = document.getElementById("alias-letras"), sig = document.getElementById("ini-sig");
    if (n) n.textContent = aviso.texto;
    if (sig) sig.disabled = !(S.ini.asignaturas.size > 0 && aviso.vale);
    return;
  }
  if (el.dataset && el.dataset.accion === "ex-nombre" && S.ex) {
    // Solo se pone al día el pie (sin repintar la página, para no quitar el foco del campo mientras se escribe)
    S.ex.nombre = el.value; tocarExamen();
    const pie = document.getElementById("pie-ex-estado"), nuevo = document.createElement("div");
    nuevo.innerHTML = pieExamen();
    // Si el pie cambia de alto (se va el aviso de «Examen guardado»), puede volver a ir pegado abajo: el campo no queda debajo
    if (pie && pie.innerHTML !== nuevo.innerHTML) { pie.innerHTML = nuevo.innerHTML; ajustarHuecos(); el.scrollIntoView({ block: "nearest" }); }
    const g = document.getElementById("guardar-examen"); if (g) g.setAttribute("aria-describedby", "resumen-ex");
  }
});

/* El reloj se actualiza solo en su vista; al volver a la página, se repinta por si toca el aviso de olvido o ha cambiado el día. */
setInterval(() => {
  if (S.vista !== "reloj" || !reloj) return;
  const c = document.getElementById("cifra-reloj");
  if (c) c.textContent = formatoReloj(relojMin());
  if (olvidado() && !document.querySelector(".aviso")) avisarOlvido();
}, 1000);
/* El aviso «¿Se te olvidó pararlo?» sustituye a «Pausar» y «Terminar»: el foco que estaba en ellos se perdería, así que
   pasa al título del aviso (el lector de pantalla lo lee, y desde ahí se llega a «Sigo estudiando»). */
function avisarOlvido() {
  repintar(document.activeElement);
  const t = document.getElementById("olvido-t");
  if (t) t.focus();
}
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { marcarVisto(); return; }
  apuntarApertura();
  if (!prog) return;
  await refrescar(); // primero lo último de la cuenta: una pestaña dormida no pisa lo que se hizo en otro dispositivo
  normalizaDia();
  if (S.vista === "reloj" && olvidado() && !document.querySelector(".aviso")) avisarOlvido();
  else if (S.vista === "hoy" || S.vista === "reloj" || S.vista === "semana") repintarSiCambia();
});

arrancar();
</script>
